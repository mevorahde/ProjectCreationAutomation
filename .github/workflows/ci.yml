{
  "name": "CI",
  "on": {
    "push": {
      "branches": [
        "master",
        "main",
        "modernize-project-creation-automation"
      ]
    },
    "pull_request": {
      "branches": [
        "master",
        "main",
        "modernize-project-creation-automation"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ci-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "test": {
      "name": "${{ matrix.os }} / Python ${{ matrix.python-version }}",
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-latest",
            "windows-latest"
          ],
          "python-version": [
            "3.10",
            "3.11",
            "3.12",
            "3.13"
          ]
        }
      },
      "env": {
        "PIP_DISABLE_PIP_VERSION_CHECK": "1",
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "steps": [
        {
          "name": "Check out source",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "${{ matrix.python-version }}",
            "cache": "pip"
          }
        },
        {
          "name": "Install bounded development dependencies",
          "run": "python -m pip install \".[dev]\""
        },
        {
          "name": "Check installed dependencies",
          "run": "python -m pip check"
        },
        {
          "name": "Compile package",
          "run": "python -m compileall -q src"
        },
        {
          "name": "Lint",
          "run": "python -m ruff check src tests tools"
        },
        {
          "name": "Type check",
          "run": "python -m mypy --strict src tests tools"
        },
        {
          "name": "Run isolated tests",
          "run": "python -m pytest -q -p no:cacheprovider"
        },
        {
          "name": "Build wheel",
          "run": "python -m build --wheel --outdir .ci-dist"
        },
        {
          "name": "Verify wheel metadata and contents",
          "run": "python tools/verify_wheel.py .ci-dist"
        }
      ]
    }
  }
}
